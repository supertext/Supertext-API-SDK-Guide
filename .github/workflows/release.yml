name: Release

# Publishes a GitHub release when the version is officially bumped: a new
# "## X.Y.Z" section at the top of CHANGELOG.md (below Unreleased), with every
# file in VERSION_FILES carrying the same number (all SDKs share one version).
# The built packages (npm, Python, NuGet, Java and Kotlin jars) are attached to the release.
# Pushes that add no new version do nothing, and a version that is already
# released is skipped. 0.x versions are published as pre-releases.
# After the release, the Python package goes to PyPI and the NuGet package to
# nuget.org, both with trusted publishing (OIDC, no secrets; environments
# "pypi" and "nuget"). npm and Maven Central are not automated yet, Packagist
# reads the tag itself: see docs/DEVELOPER.md → Releasing.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Files that must carry the released version (PHP: the Git tag is the version).
  VERSION_FILES: >-
    sdk/typescript/package.json
    sdk/python/pyproject.toml
    sdk/dotnet/src/Supertext.Sdk/Supertext.Sdk.csproj
    sdk/java/pom.xml
    sdk/kotlin/pom.xml
    sdk/typescript/src/version.ts
    sdk/php/src/Supertext.php
    sdk/python/src/supertext/version.py
    sdk/dotnet/src/Supertext.Sdk/SdkVersion.cs
    sdk/java/src/main/java/com/supertext/sdk/SdkInfo.java
    sdk/kotlin/src/main/kotlin/com/supertext/sdk/Sdk.kt

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version from CHANGELOG.md
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 -oE '^## \[?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$version" ]; then
            echo "No released version in CHANGELOG.md yet, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for f in $VERSION_FILES; do
            if ! grep -qF "$version" "$f"; then
              echo "::error file=$f::CHANGELOG.md says $version, but $f doesn't. Bump it there too."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  packages:
    name: Build packages
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          (cd sdk/typescript && npm ci && npm run build && npm pack --pack-destination ../../dist)
          python -m pip install build && python -m build sdk/python --outdir dist
          dotnet pack sdk/dotnet/src/Supertext.Sdk -c Release -o dist
          (cd sdk/java && mvn -B -ntp -DskipTests package && cp target/supertext-sdk-*.jar ../../dist/)
          (cd sdk/kotlin && mvn -B -ntp -DskipTests package && cp target/supertext-sdk-kotlin-*.jar ../../dist/)
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  release:
    name: Create the release
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Create the release
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '/^## /{ if (p) exit; if (index($0, v) && $0 ~ /^## \[?[0-9]/) { p=1; next } } p' CHANGELOG.md > section.md
          {
            if [ "${VERSION%%.*}" = "0" ]; then printf '**Pre-release.** '; fi
            echo "SDKs and integration guide: [README](https://github.com/$GH_REPO/blob/v$VERSION/README.md)."
            echo
            echo "## What's in $VERSION"
            cat section.md
          } > notes.md
          pre=()
          if [ "${VERSION%%.*}" = "0" ]; then pre=(--prerelease); fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file notes.md "${pre[@]}" dist/*
          echo "Released https://github.com/$GH_REPO/releases/tag/v$VERSION"

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/supertext-sdk/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Keep only the Python packages
        run: mkdir pydist && mv dist/supertext_sdk-* pydist/ && ls -l pydist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pydist/

  nuget:
    name: Publish to NuGet
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Supertext.Sdk
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Get a short-lived NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: remy.blaettler # nuget.org profile that owns the trusted publishing policy
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push dist/Supertext.Sdk.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
